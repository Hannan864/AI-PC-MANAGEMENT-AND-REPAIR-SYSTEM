
<!DOCTYPE html>
<html lang="en" class="bg-[#020617]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Sentinel Platform</title>
    <meta name="description" content="Advanced System Intelligence & Diagnostics">
    <meta name="theme-color" content="#020617">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; background: #020617; overflow: hidden; }
        #root:empty { display: none; }
        .boot-loader {
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #020617;
            color: #64748b; font-family: 'Inter', sans-serif;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(99, 102, 241, 0.1);
            border-top-color: #6366f1; border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .boot-text {
            margin-top: 24px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.2em; color: #475569;
        }
        .emergency-reset {
            display: none; margin-top: 32px; padding: 12px 24px;
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5; border-radius: 8px; font-size: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        .emergency-reset:hover { background: rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
    <div id="root">
        <div class="boot-loader">
            <div class="spinner"></div>
            <p class="boot-text">Initialising Secure Environment</p>
            <button id="reset-btn" class="emergency-reset" onclick="clearSystemCache()">Force Cache Purge & Reload</button>
        </div>
    </div>
    
    <script type="module" src="./index.tsx"></script>
    
    <script>
        // Module Load Monitoring
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'SCRIPT') {
                console.error('Critical Module Load Failure:', e.target.src);
                document.querySelector('.boot-text').innerText = 'Module Load Failure - Check Network';
                document.getElementById('reset-btn').style.display = 'block';
            }
        }, true);

        // Fail-safe Timeout
        setTimeout(() => {
            const root = document.getElementById('root');
            if (root && root.querySelector('.boot-loader')) {
                document.querySelector('.boot-text').innerText = 'Ignition Timeout - Local Cache Conflict';
                document.getElementById('reset-btn').style.display = 'block';
            }
        }, 6000);

        function clearSystemCache() {
            console.log('Initiating System-Wide Cache Purge...');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(regs => {
                    for (let reg of regs) reg.unregister();
                });
            }
            if ('caches' in window) {
                caches.keys().then(names => {
                    for (let name of names) caches.delete(name);
                });
            }
            localStorage.clear();
            sessionStorage.clear();
            setTimeout(() => window.location.reload(true), 500);
        }
    </script>
</body>
</html>
