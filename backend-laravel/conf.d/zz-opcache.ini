; ============================================================================
; SMART PC HUB — Project-local PHP OPcache configuration
; ============================================================================
; Loaded via PHP_INI_SCAN_DIR by bat/launch_backend.bat.
;
; WHY: Without OPcache the PHP built-in server recompiles the entire Laravel
; framework on EVERY request (~3 seconds each on this machine). Because the
; built-in server is single-threaded, that backlog causes 15s+ request queues
; and "Failed to update status" errors in the frontend. Enabling OPcache drops
; each request to well under half a second.
;
; Keep validate_timestamps=1 + revalidate_freq=0 so code edits are still picked
; up immediately during development.
; ============================================================================

zend_extension=C:/php83/ext/php_opcache.dll

; FIX: keep the PHP process environment out of $_ENV.
; With the default variables_order = "EGPCS" on PHP 8.3 for Windows,
; Laravel's `artisan serve` passes its child `php -S` server an environment
; that is stripped of every non-passthrough variable, which makes the child
; fail with "Failed to listen on 127.0.0.1:PORT (reason: ?)" on EVERY port.
; Setting GPCS here (the launcher loads this file via PHP_INI_SCAN_DIR, and
; the serve command also passes -d variables_order=GPCS) keeps $_ENV empty so
; the child server inherits the full environment and binds normally.
; NOTE: getenv()/putenv() and the Laravel .env loader are NOT affected.
variables_order = "GPCS"

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=5
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1
